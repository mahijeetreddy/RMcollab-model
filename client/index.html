<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="RMcollab — real-time collaboration rooms with GPU-backed media enhancement."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#2551d4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1017" media="(prefers-color-scheme: dark)" />
    <title>RMcollab</title>
    <script>
      // Runs before the first paint so the document never renders in the wrong
      // theme. Storage access throws in some privacy modes, hence the try/catch.
      (function () {
        var choice = "system";
        try {
          var saved = window.localStorage.getItem("rmcollab.theme");
          if (saved === "light" || saved === "dark" || saved === "system") choice = saved;
        } catch (e) {
          /* storage unavailable: fall back to following the system */
        }
        var resolved = choice;
        if (choice === "system") {
          // No stored choice and no system signal => light is the default.
          resolved =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        }
        var root = document.documentElement;
        root.setAttribute("data-theme", resolved);
        root.setAttribute("data-theme-choice", choice);
        root.style.colorScheme = resolved;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
