<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="RMcollab">
  <!-- Same motif as the in-app brand mark: two overlapping rounded squares for
       two people working in the same room. Kept chunky and high-contrast so it
       still reads as two shapes at 16px. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b6bef"/>
      <stop offset="1" stop-color="#1e43b8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#tile)"/>
  <rect x="11" y="15" width="29" height="29" rx="9" fill="#ffffff" opacity="0.55"/>
  <rect x="24" y="20" width="29" height="29" rx="9" fill="#ffffff"/>
</svg>
