name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript - typecheck, unit tests, contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck every package
        run: npm run typecheck

      - name: Gateway unit tests
        run: npm run test:gateway

      - name: Client unit tests
        run: npm run test:client

      # Worker events are produced in Python and consumed in TypeScript. This is
      # the only thing that notices when the two definitions drift apart.
      - name: Cross-language contract check
        run: npm run check:contracts

      - name: Client production build
        run: npm run build -w client

  python:
    name: Python - worker unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: workers/requirements-dev.txt

      # Only the light requirements: the GPU pipelines need torch/CUDA, which a
      # hosted runner has no card for, so those are verified on real hardware.
      - run: pip install -r workers/requirements-dev.txt

      - name: Worker unit tests
        run: python -m pytest
