# Load balancer in front of the gateway replicas.
#
# The gateway is stateless by design (Postgres holds room state, Redis pub/sub
# fans events between replicas), so requests and sockets can land on any replica.
# Round-robin is therefore deliberate, not an oversight: no sticky sessions. If
# two browsers land on different replicas and still see each other's messages,
# the cross-replica fan-out is genuinely working.
events { worker_connections 1024; }

http {
  # Docker's embedded DNS returns every replica's IP, in rotating order. nginx
  # would resolve `gateway` once at boot and pin to one container, so proxy_pass
  # goes through a variable to force re-resolution and pick up new replicas as
  # they are scaled up or down.
  resolver 127.0.0.11 valid=5s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 4000;

    # Uploads are whole media files; the default 1m would reject most videos.
    client_max_body_size 128m;

    location / {
      set $gateway_upstream http://gateway:4000;
      proxy_pass $gateway_upstream;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      # WebSockets are long-lived; without this nginx cuts them at 60s.
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }
  }
}
