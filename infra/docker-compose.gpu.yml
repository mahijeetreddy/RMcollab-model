# On a host with an NVIDIA GPU, after docker-compose.prod.yml: the media pools
# get the GPU back (image upscaling and transcription are many times faster).
# Needs the NVIDIA Container Toolkit on the host.
x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  image-worker:
    <<: *gpu
  audio-worker:
    <<: *gpu
  video-worker:
    <<: *gpu
